server.port=8081
spring.application.name=user-platform
spring.data.mongodb.uri=mongodb://localhost:27017/video_platform
spring.data.mongodb.auto-index-creation=true

# Production me JWT_SECRET environment variable se do (kam se kam 32 characters)
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-before-deploy-0123456789}
jwt.expiration-ms=86400000
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5171}

# Razorpay TEST keys (environment variable se do, GitHub par commit mat karna)
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# Demo payment (sirf dikhane ke liye). true karne par Razorpay ke bina Premium activate hota h.
payment.demo-mode=${PAYMENT_DEMO_MODE:false}
